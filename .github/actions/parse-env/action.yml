# ------------------------------------------------------------------------------------
#  Parse Environment Variables Composite Action (GoFortress)
#
#  Purpose: Parse JSON environment variables into GITHUB_ENV, eliminating duplicate
#  parsing logic across all GoFortress workflows.
#
#  Features:
#    - JSON validation with clear error messages
#    - Preserves exact output format for compatibility
#    - Maintains security boundaries (no secret exposure)
#    - Follows existing fortress patterns (emoji prefixes, structured logging)
#    - Error handling matches existing implementations
#
#  Usage:
#    - uses: ./.github/actions/parse-env
#      with:
#        env-json: ${{ inputs.env-json }}
#
#  Maintainer: @mrz1836
#
#  SECURITY INVARIANT: only invoke this action (and its siblings under `.github/actions/`)
#  from `push` / `pull_request` runs with a powerless (read-only on forks) token. Values
#  that could be influenced by a PR are routed through `env:` and referenced as quoted
#  "$VAR". Do NOT wire these actions to `pull_request_target` / `workflow_run` (privileged
#  token on an untrusted ref) without first auditing every `${{ }}`→shell/jq sink.
#
# ------------------------------------------------------------------------------------

name: "Parse Environment Variables"
description: "Parse JSON environment variables into GITHUB_ENV with validation and error handling"

inputs:
  env-json:
    description: "JSON string of environment variables to parse and set"
    required: true

runs:
  using: "composite"
  steps:
    # --------------------------------------------------------------------
    # Parse and validate JSON environment variables
    # --------------------------------------------------------------------
    - name: 🔧 Parse environment variables
      shell: bash
      env:
        ENV_JSON: ${{ inputs.env-json }}
      run: |
        echo "📋 Setting environment variables..."

        # Validate JSON format before processing
        if ! echo "$ENV_JSON" | jq empty 2>/dev/null; then
          echo "❌ ERROR: Invalid JSON format in env-json input!" >&2
          echo "   Please ensure the input is valid JSON." >&2
          exit 1
        fi

        # Check if JSON is empty or null
        if [[ -z "$ENV_JSON" ]] || [[ "$ENV_JSON" == "null" ]] || [[ "$ENV_JSON" == "{}" ]]; then
          echo "❌ ERROR: Empty or null JSON provided!" >&2
          echo "   Please provide valid environment variables in JSON format." >&2
          exit 1
        fi

        # Parse and set each variable. Harden $GITHUB_ENV writes (defense-in-depth):
        # base64-encode values so newlines/special chars can't corrupt the read loop,
        # accept only valid env-var names, and reject newline-bearing values (which could
        # otherwise inject arbitrary extra env vars). base64's decode flag differs by
        # platform (GNU: -d, BSD/macOS: -D) — detect it.
        if printf '' | base64 -d >/dev/null 2>&1; then B64D=-d; else B64D=-D; fi
        echo "$ENV_JSON" | jq -r 'to_entries[] | .key, (.value | tostring | @base64)' | while IFS= read -r key; do
          IFS= read -r value_b64
          if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "⚠️  WARNING: Skipping invalid variable name: $key" >&2
            continue
          fi
          value=$(printf '%s' "$value_b64" | base64 "$B64D")
          if [[ "$value" == *$'\n'* ]]; then
            echo "⚠️  WARNING: Skipping $key: value contains a newline" >&2
            continue
          fi
          printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
        done

        # Count and report variables set
        VAR_COUNT=$(echo "$ENV_JSON" | jq 'keys | length')
        echo "✅ Environment variables parsed successfully ($VAR_COUNT variables)"
