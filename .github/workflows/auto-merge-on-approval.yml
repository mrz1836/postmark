# ------------------------------------------------------------------------------------
#  Auto-merge on Approval Workflow
#
#  Purpose: Automatically enable auto-merge for PRs when configurable approval
#           and readiness conditions are met. GitHub handles the actual merge
#           when all status checks pass.
#
#  Configuration: All settings are loaded from modular .github/env/ files for
#  centralized management across all workflows.
#
#  Triggers:
#  - Completion of "Auto-merge Trigger" (auto-merge-trigger.yml) when its
#    "📨 Queue auto-merge evaluation" job ran: pull request reviews (submitted,
#    dismissed) and every pull request change that can flip a condition below
#    (pushes, title, labels, draft state, review requests, reopening, manual
#    arming). The trigger also queues "Dependabot Auto-merge" and fork "PR
#    Management" runs; this workflow skips those right away, before any checkout.
#
#  Why two workflows: review events always run the PR's own copy of a workflow,
#  so they can never be trusted with the GitHub App key. `workflow_run` always
#  runs this file from the DEFAULT branch; it re-reads the PR from the API and
#  trusts nothing produced by the PR's run.
#
#  Authentication (no personal access tokens):
#  - The `evaluate` job uses only the built-in GITHUB_TOKEN (read-only).
#  - The `apply` job enables/disables auto-merge with a short-lived GitHub App
#    installation token. It runs only when the repository variable
#    AUTO_MERGE_APP_CLIENT_ID is set, and reads the App private key from the
#    `auto-merge` environment secret AUTO_MERGE_APP_PRIVATE_KEY. That environment
#    must only allow protected long-lived branches (e.g. the default branch).
#  - Using an App (not GITHUB_TOKEN) also means the eventual merge triggers the
#    push workflows on the base branch.
#
#  Auto-merge Rules (configurable via .github/env/):
#  - Minimum number of approvals
#  - No requested reviewers or teams remaining (if configured)
#  - No "Changes Requested" reviews
#  - PR ready for review (not draft, no WIP indicators)
#  - Required opt-in label present (if configured)
#  - Bot PRs handled separately (if configured)
#  - The base branch must require status checks (always enforced)
#
#  Revocation: auto-merge armed by the App is disabled as soon as any rule above
#  stops holding. "Changes Requested" disables auto-merge whoever armed it; an
#  arming made by hand is otherwise left alone.
#
#  Maintainer: @mrz1836
#
# ------------------------------------------------------------------------------------

name: Auto-merge on Approval

# --------------------------------------------------------------------
# Trigger Configuration
#
# zizmor's dangerous-triggers audit flags every `workflow_run` trigger. This one
# uses no artifacts, outputs or code from the triggering run: `evaluate` re-reads
# the PR from the API, and `apply` re-checks it and pins arming to the evaluated
# head commit (see "Why two workflows" above).
# --------------------------------------------------------------------
on: # zizmor: ignore[dangerous-triggers] see "Trigger Configuration" above
  workflow_run:
    workflows: ["Auto-merge Trigger"]
    types: [completed]

# Security: Restrict default permissions (jobs must explicitly request what they need)
permissions: {}

# --------------------------------------------------------------------
# Concurrency Control — per job, never cancelling:
# - `evaluate` has no concurrency group. It only reads, so overlapping runs are
#   harmless, and no run (however it ends) can cancel another one's evaluation.
# - `apply` runs one at a time per branch and is never cancelled halfway (e.g.
#   after enabling, before its comment and labels). It does not trust the
#   evaluation that queued it: it re-reads the PR and works out enable / disable
#   / nothing itself, so a queued or superseded run can't act on stale data.
# --------------------------------------------------------------------

# --------------------------------------------------------------------
# Environment Variables
# --------------------------------------------------------------------
# Note: Configuration variables are loaded from modular .github/env/ files

jobs:
  # ----------------------------------------------------------------------------------
  # Evaluate the PR (GITHUB_TOKEN only, read-only — never sees the App key)
  #
  # Workflow phases (each preserved as a step):
  #   🌍 Load environment        → reads .github/env/*
  #   🔧 Extract configuration   → exports AUTO_MERGE_* vars to env
  #   🔍 Evaluate conditions     → decides enable / disable / skip
  #   📊 Generate summary        → always
  #
  # "enable" / "disable" only mean `apply` must run; `apply` re-derives the action
  # from fresh data, then enables/disables auto-merge and posts comments/labels.
  # ----------------------------------------------------------------------------------
  evaluate:
    name: 🤖 Auto-merge on Approval
    # Only completed (not skipped) trigger runs from PRs in this repository. Fork
    # PRs are never auto-merged (also enforced in the script), so skip them early.
    # A trigger run whose jobs all skipped concludes "skipped"; the first step also
    # confirms the trigger's evaluation job itself ran (its other jobs queue other
    # workflows), so this never relies on the conclusion alone.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request_review", "pull_request"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Required: Confirm the trigger job ran (not skipped by its gate)
      contents: read # Required: Sparse checkout for env files + read branch rules
      pull-requests: read # Required: Read PR state and reviews
    outputs:
      action: ${{ steps.process.outputs.action || steps.gate.outputs.action }}
      pr-number: ${{ steps.process.outputs.pr-number }}
      disable-reason: ${{ steps.process.outputs.disable-reason }}
      merge-type: ${{ steps.process.outputs.merge-type }}
      delete-branch: ${{ steps.process.outputs.delete-branch }}
      min-approvals: ${{ steps.process.outputs.min-approvals }}
      require-all-reviews: ${{ steps.process.outputs.require-all-reviews }}
      skip-draft: ${{ steps.process.outputs.skip-draft }}
      skip-wip: ${{ steps.process.outputs.skip-wip }}
      wip-labels: ${{ steps.process.outputs.wip-labels }}
      require-label: ${{ steps.process.outputs.require-label }}
      automerge-label: ${{ steps.process.outputs.automerge-label }}
      comment-on-enable: ${{ steps.process.outputs.comment-on-enable }}
      comment-on-disable: ${{ steps.process.outputs.comment-on-disable }}
      labels-to-add: ${{ steps.process.outputs.labels-to-add }}

    steps:
      # --------------------------------------------------------------------
      # Only evaluate when the trigger's evaluation job actually ran: its gate
      # skips events that can't change the decision (comment-only reviews,
      # body edits), and its other jobs only queue Dependabot Auto-merge and
      # fork PR Management. Checked first, so those runs end here cheaply.
      # This is just a wake-up filter: the PR's copy of the trigger decides
      # it, so nothing below trusts it; everything is re-read from the API.
      # --------------------------------------------------------------------
      - name: 🚦 Confirm the trigger queued an evaluation
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The trigger job that queues this workflow (auto-merge-trigger.yml)
          QUEUE_JOB: "📨 Queue auto-merge evaluation"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: { jobs: triggerJobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            if (triggerJobs.some(job => job.name === process.env.QUEUE_JOB && job.conclusion === 'success')) {
              core.setOutput('queued', 'true');
            } else {
              console.log(`⏭️ "${process.env.QUEUE_JOB}" did not run for this event - nothing to evaluate`);
              core.setOutput('queued', 'false');
              core.setOutput('action', 'skip-trigger-gated');
            }

      # --------------------------------------------------------------------
      # Check out code to access env file
      # --------------------------------------------------------------------
      - name: 📥 Checkout code (sparse)
        if: steps.gate.outputs.queued == 'true'
        # SECURITY: on workflow_run, github.sha is the latest commit on the DEFAULT
        # branch — the same commit this workflow file came from — so the local
        # ./.github/actions/load-env action is never a PR-controlled version.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/env
            .github/actions/load-env

      # --------------------------------------------------------------------
      # Load and parse environment file
      # --------------------------------------------------------------------
      - name: 🌍 Load environment variables
        id: load-env
        if: steps.gate.outputs.queued == 'true'
        uses: ./.github/actions/load-env

      # --------------------------------------------------------------------
      # Extract auto-merge configuration up-front
      # --------------------------------------------------------------------
      - name: 🔧 Extract configuration
        if: steps.gate.outputs.queued == 'true'
        env:
          ENV_JSON: ${{ steps.load-env.outputs.env-json }}
          APP_CLIENT_ID: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
        run: |
          echo "📋 Extracting auto-merge configuration from environment..."

          # Single jq pass for all config we need across steps
          MIN_APPROVALS=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_MIN_APPROVALS')
          if [[ -z "$MIN_APPROVALS" ]] || [[ "$MIN_APPROVALS" == "null" ]]; then
            MIN_APPROVALS="1"  # Default to 1 approval
          fi
          # Fail closed: a non-number would make every approval comparison false
          if ! [[ "$MIN_APPROVALS" =~ ^[0-9]+$ ]]; then
            echo "❌ AUTO_MERGE_MIN_APPROVALS must be a whole number (got '$MIN_APPROVALS')"
            exit 1
          fi

          MERGE_TYPES=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_ALLOWED_MERGE_TYPES')
          DEFAULT_MERGE_TYPE=$(echo "$MERGE_TYPES" | cut -d',' -f1)
          if [[ -z "$DEFAULT_MERGE_TYPE" ]]; then
            DEFAULT_MERGE_TYPE="squash"
          fi

          {
            echo "MIN_APPROVALS=$MIN_APPROVALS"
            echo "REQUIRE_ALL_REVIEWS=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_REQUIRE_ALL_REQUESTED_REVIEWS')"
            echo "MERGE_TYPES=$MERGE_TYPES"
            echo "DEFAULT_MERGE_TYPE=$DEFAULT_MERGE_TYPE"
            echo "DELETE_BRANCH=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_DELETE_BRANCH')"
            echo "SKIP_DRAFT=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_DRAFT')"
            echo "SKIP_WIP=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_WIP')"
            echo "WIP_LABELS=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_WIP_LABELS')"
            echo "COMMENT_ON_ENABLE=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_COMMENT_ON_ENABLE')"
            echo "COMMENT_ON_DISABLE=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_COMMENT_ON_DISABLE')"
            echo "LABELS_TO_ADD=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_LABELS_TO_ADD')"
            echo "SKIP_BOT_PRS=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_BOT_PRS')"
            echo "SKIP_FORK_PRS=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_FORK_PRS')"
            echo "COMMENT_ON_FORK_SKIP=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_COMMENT_ON_FORK_SKIP')"
            echo "AUTO_MERGE_REQUIRE_LABEL=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_REQUIRE_LABEL')"
            echo "AUTO_MERGE_LABEL=$(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_LABEL')"
          } >> "$GITHUB_ENV"

          echo "🔍 Configuration loaded:"
          echo "  ✅ Min approvals: $MIN_APPROVALS"
          echo "  🔀 Merge types: $MERGE_TYPES (default: $DEFAULT_MERGE_TYPE)"
          echo "  🤖 Skip bot PRs: $(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_BOT_PRS')"
          echo "  🍴 Skip fork PRs: $(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_SKIP_FORK_PRS')"
          echo "  🏷️ Require automerge label: $(echo "$ENV_JSON" | jq -r '.AUTO_MERGE_REQUIRE_LABEL')"
          if [[ -n "$APP_CLIENT_ID" ]]; then
            echo "  🔑 Enable/disable: GitHub App ($APP_CLIENT_ID) via the 'auto-merge' environment"
          else
            echo "  🔑 Enable/disable: not configured (AUTO_MERGE_APP_CLIENT_ID unset) — evaluation only"
          fi

      # --------------------------------------------------------------------
      # Evaluate the PR from fresh API data
      # --------------------------------------------------------------------
      - name: 🔍 Check conditions
        id: process
        if: steps.gate.outputs.queued == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Configuration the `apply` job needs (it has no checkout or env files)
            core.setOutput('merge-type', process.env.DEFAULT_MERGE_TYPE);
            core.setOutput('delete-branch', process.env.DELETE_BRANCH);
            core.setOutput('min-approvals', process.env.MIN_APPROVALS);
            core.setOutput('require-all-reviews', process.env.REQUIRE_ALL_REVIEWS);
            core.setOutput('skip-draft', process.env.SKIP_DRAFT);
            core.setOutput('skip-wip', process.env.SKIP_WIP);
            core.setOutput('wip-labels', process.env.WIP_LABELS);
            core.setOutput('require-label', process.env.AUTO_MERGE_REQUIRE_LABEL);
            core.setOutput('automerge-label', process.env.AUTO_MERGE_LABEL || 'automerge');
            core.setOutput('comment-on-enable', process.env.COMMENT_ON_ENABLE);
            core.setOutput('comment-on-disable', process.env.COMMENT_ON_DISABLE);
            core.setOutput('labels-to-add', process.env.LABELS_TO_ADD);

            // (The "🚦 Confirm the trigger queued an evaluation" step already checked
            // that the trigger's evaluation job ran.)

            // ————————————————————————————————————————————————————————————————
            // Resolve the PR. Nothing from the trigger run is trusted: only its
            // head branch/SHA are used to find the PR, then everything is
            // re-read from the API. Only PRs in this repository count (the
            // payload can list PRs of other repositories with the same head),
            // and a head shared by several PRs is skipped, never guessed.
            // ————————————————————————————————————————————————————————————————
            const candidates = new Set((run.pull_requests || [])
              .filter(p => p.head?.sha === run.head_sha && p.base?.repo?.id === context.payload.repository.id)
              .map(p => p.number));
            if (candidates.size === 0) {
              const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              for (const p of associated) {
                if (p.state === 'open' && p.head?.ref === run.head_branch && p.head?.repo?.full_name === `${owner}/${repo}`) {
                  candidates.add(p.number);
                }
              }
            }
            if (candidates.size === 0) {
              console.log(`ℹ️  No open pull request found for ${run.head_branch} @ ${run.head_sha}`);
              core.setOutput('action', 'skip-no-pr');
              return;
            }
            if (candidates.size > 1) {
              console.log(`ℹ️  Several pull requests (#${[...candidates].join(', #')}) have head ${run.head_sha} - none is acted on`);
              core.setOutput('action', 'skip-ambiguous-pr');
              return;
            }
            const [prNumber] = candidates;

            console.log(`🔍 Checking auto-merge conditions for PR #${prNumber}`);
            console.log('════════════════════════════════════════════════════════════════');

            // Get fresh PR data
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            core.setOutput('pr-number', String(prNumber));

            console.log(`📋 PR #${prNumber}: "${pr.title}"`);
            console.log(`👤 Author: ${pr.user.login} (${pr.user.type})`);

            if (pr.state !== 'open') {
              console.log(`⏭️ PR is ${pr.state} - nothing to do`);
              core.setOutput('action', 'skip-not-open');
              return;
            }

            // ————————————————————————————————————————————————————————————————
            // Check if we should skip bot PRs
            // ————————————————————————————————————————————————————————————————
            const isBot = pr.user.type === 'Bot' || pr.user.login.endsWith('[bot]');
            if (isBot && process.env.SKIP_BOT_PRS === 'true') {
              console.log('🤖 Skipping bot PR (handled by separate workflow)');
              core.setOutput('action', 'skip-bot');
              return;
            }

            // ————————————————————————————————————————————————————————————————
            // Check if we should skip fork PRs
            // ————————————————————————————————————————————————————————————————

            // Handle edge case: fork repository deleted/inaccessible (pr.head.repo is null).
            // Fail CLOSED — provenance cannot be verified, so never auto-merge, independent
            // of the AUTO_MERGE_SKIP_FORK_PRS toggle.
            if (!pr.head.repo) {
              console.log('⚠️  PR head repository is null (fork may have been deleted) — refusing to auto-merge');
              core.setOutput('action', 'skip-deleted-fork');
              return;
            }

            // Hard guard: fork PRs are NEVER auto-merged, independent of the
            // AUTO_MERGE_SKIP_FORK_PRS toggle. Auto-approving/merging fork-authored code is
            // unsafe.
            {
              const headRepoFullName = pr.head.repo.full_name;
              const baseRepoFullName = `${owner}/${repo}`;
              const isForkPR = headRepoFullName !== baseRepoFullName;

              if (isForkPR) {
                console.log('🍴 Skipping fork PR (security policy: fork PRs are never auto-merged)');
                console.log(`   Fork source: ${headRepoFullName}`);
                console.log(`   Base repository: ${baseRepoFullName}`);
                if (process.env.SKIP_FORK_PRS !== 'true') {
                  console.log('   ℹ️  (AUTO_MERGE_SKIP_FORK_PRS is not "true", but fork-skip is hard-enforced for safety)');
                }
                core.setOutput('action', 'skip-fork');
                return;
              }
            }

            // ————————————————————————————————————————————————————————————————
            // Read reviews. Everything the decision depends on is gathered before
            // any guard can return, because revocation (below) must see it all.
            // ————————————————————————————————————————————————————————————————
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // Get latest review per user. Only verdicts count: a later "Comment" review
            // doesn't withdraw an approval (same as GitHub), and PENDING isn't submitted.
            // The apply job re-counts with the same rules — keep the two in sync.
            const VERDICT_STATES = new Set(['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']);
            const latestReviews = {};
            reviews.forEach(review => {
              if (!VERDICT_STATES.has(review.state)) return;
              // review.user is null for deleted accounts - fall back to a unique
              // key so the review still counts instead of throwing.
              const userId = review.user?.id ?? `deleted-user:${review.id}`;
              if (!latestReviews[userId] || review.submitted_at > latestReviews[userId].submitted_at) {
                latestReviews[userId] = review;
              }
            });

            const currentReviews = Object.values(latestReviews);
            // Only count approvals from users with write-ish access (OWNER/MEMBER/COLLABORATOR).
            // Prevents a drive-by APPROVED review from an external account from satisfying the
            // approval threshold. Defense-in-depth on top of branch protection + CODEOWNERS.
            const TRUSTED_ASSOCIATIONS = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const approvals = currentReviews.filter(r => r.state === 'APPROVED' && TRUSTED_ASSOCIATIONS.has(r.author_association)).length;
            const changesRequested = currentReviews.filter(r => r.state === 'CHANGES_REQUESTED').length;
            // Users AND teams still asked to review
            const pendingReviews = (pr.requested_reviewers || []).length + (pr.requested_teams || []).length;
            const minApprovals = parseInt(process.env.MIN_APPROVALS, 10); // validated in "Extract configuration"

            console.log(`👥 Reviews: ${approvals} approvals, ${changesRequested} changes requested, ${pendingReviews} pending`);
            console.log(`✅ Required approvals: ${minApprovals}`);

            // The base branch must require status checks (ruleset or classic branch
            // protection), or "auto-merge" would merge immediately, before CI. A PR
            // can be retargeted at any time, so this is re-checked like the rest.
            // null = couldn't read the rules, which fails closed below.
            let requiredChecks = null;
            try {
              const { data: rules } = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
                owner,
                repo,
                branch: pr.base.ref,
              });
              const rulesetChecks = rules
                .filter(r => r.type === 'required_status_checks')
                .flatMap(r => r.parameters?.required_status_checks || []).length;

              const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
              const classic = branch.protection?.required_status_checks;
              const classicChecks = classic && classic.enforcement_level !== 'off' ? (classic.contexts || []).length : 0;

              console.log(`🛡️ Required checks on '${pr.base.ref}': rulesets=${rulesetChecks} classic=${classicChecks}`);
              requiredChecks = rulesetChecks + classicChecks;
            } catch (error) {
              console.log(`❌ Could not read rules for '${pr.base.ref}' (${error.message}) — failing closed`);
            }

            // ————————————————————————————————————————————————————————————————
            // Every condition for arming auto-merge, in reporting order. The apply
            // job re-checks the same list in bash — keep the two in sync.
            // ————————————————————————————————————————————————————————————————
            const title = pr.title || '';
            const labels = pr.labels.map(l => l.name);
            const automergeLabel = process.env.AUTO_MERGE_LABEL || 'automerge';
            const blockers = [];

            if (process.env.SKIP_DRAFT === 'true' && pr.draft) {
              blockers.push({ action: 'skip-draft', reason: 'PR is a draft' });
            }
            if (process.env.SKIP_WIP === 'true') {
              const wipLabels = process.env.WIP_LABELS.split(',').map(l => l.trim());
              if (/\b(wip|work.in.progress)\b/i.test(title) || labels.some(label => wipLabels.includes(label))) {
                blockers.push({ action: 'skip-wip', reason: 'PR is marked as work in progress' });
              }
            }
            if (process.env.AUTO_MERGE_REQUIRE_LABEL === 'true' && !labels.includes(automergeLabel)) {
              blockers.push({ action: 'skip-missing-automerge-label', reason: `missing label "${automergeLabel}"` });
            }
            if (changesRequested > 0) {
              blockers.push({ action: 'conditions-not-met', reason: 'changes requested' });
            }
            if (approvals < minApprovals) {
              blockers.push({ action: 'conditions-not-met', reason: `approvals ${approvals}/${minApprovals}` });
            }
            if (process.env.REQUIRE_ALL_REVIEWS === 'true' && pendingReviews > 0) {
              blockers.push({ action: 'conditions-not-met', reason: `${pendingReviews} review request(s) pending` });
            }
            if (requiredChecks === null) {
              blockers.push({ action: 'skip-no-required-checks', reason: 'could not read the base branch required checks' });
            } else if (requiredChecks === 0) {
              blockers.push({ action: 'skip-no-required-checks', reason: 'base branch requires no status checks' });
            }
            const reasons = blockers.map(b => b.reason).join(', ');

            // ————————————————————————————————————————————————————————————————
            // Revocation — state-based, so it runs before any guard can return:
            // - "Changes Requested" disables auto-merge whoever armed it.
            // - An arming by a bot (this workflow's App) lasts only while every
            //   condition above still holds (an approval dismissed, the label
            //   removed, a WIP label added...). The base branch may require fewer
            //   approvals than this workflow, so GitHub alone would still merge.
            // - A maintainer who armed it by hand is otherwise left alone.
            // Any bot arming counts here (this job can't know the App's name); the
            // apply job confirms it is this App, on fresh data, before revoking.
            // ————————————————————————————————————————————————————————————————
            if (pr.auto_merge) {
              const armedByBot = pr.auto_merge.enabled_by?.type === 'Bot';
              console.log(`🔒 Auto-merge is armed by ${pr.auto_merge.enabled_by?.login ?? 'unknown'}`);
              if (changesRequested > 0 || (armedByBot && blockers.length > 0)) {
                const reason = armedByBot ? reasons : 'changes requested';
                console.log(`🛑 Auto-merge will be disabled: ${reason}`);
                core.setOutput('action', 'disable');
                core.setOutput('disable-reason', reason);
                return;
              }
              if (blockers.length === 0) {
                console.log('✅ Auto-merge already enabled');
                core.setOutput('action', 'already-enabled');
                return;
              }
              console.log(`ℹ️  Armed by hand - left alone (${reasons})`);
            }

            if (blockers.length > 0) {
              console.log(`⏳ Not enabling auto-merge: ${reasons}`);
              core.setOutput('action', blockers[0].action);
              return;
            }

            console.log('🚀 All conditions met - auto-merge will be enabled');
            core.setOutput('action', 'enable');

      # --------------------------------------------------------------------
      # Generate a workflow summary report
      # --------------------------------------------------------------------
      - name: 📊 Generate workflow summary
        if: always()
        env:
          PR_NUMBER: ${{ steps.process.outputs.pr-number }}
          ACTION: ${{ steps.process.outputs.action || steps.gate.outputs.action }}
          DISABLE_REASON: ${{ steps.process.outputs.disable-reason }}
          APP_CLIENT_ID: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
        run: |
          echo "📊 Generating workflow summary..."

          # Not queued by the trigger: no configuration was loaded, keep it short
          if [[ "$ACTION" == "skip-trigger-gated" ]]; then
            {
              echo "# 🤖 Auto-merge on Approval Summary"
              echo ""
              echo "ℹ️ Skipped: the trigger didn't queue an evaluation for this event (it can't change the decision, or it was for another workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Determine action taken
          case "$ACTION" in
            "enable")                        ACTION_DESC="🚀 Enable auto-merge" ;;
            "disable")                       ACTION_DESC="🛑 Disable auto-merge ($DISABLE_REASON)" ;;
            "already-enabled")               ACTION_DESC="✅ Auto-merge already enabled" ;;
            "skip-bot")                      ACTION_DESC="🤖 Skipped (bot PR)" ;;
            "skip-fork")                     ACTION_DESC="🍴 Skipped (fork PR - security policy)" ;;
            "skip-deleted-fork")             ACTION_DESC="🍴 Skipped (deleted fork PR)" ;;
            "skip-draft")                    ACTION_DESC="📝 Skipped (draft PR)" ;;
            "skip-wip")                      ACTION_DESC="🚧 Skipped (work in progress)" ;;
            "skip-missing-automerge-label")  ACTION_DESC="🏷️ Skipped (missing automerge label)" ;;
            "skip-no-required-checks")       ACTION_DESC="🚫 Skipped (base branch requires no status checks)" ;;
            "skip-no-pr")                    ACTION_DESC="ℹ️ Skipped (no open PR for this run)" ;;
            "skip-ambiguous-pr")             ACTION_DESC="ℹ️ Skipped (several PRs share this head commit)" ;;
            "skip-trigger-gated")            ACTION_DESC="ℹ️ Skipped (trigger event can't change the decision)" ;;
            "skip-not-open")                 ACTION_DESC="ℹ️ Skipped (PR not open)" ;;
            "conditions-not-met")            ACTION_DESC="⏳ Conditions not met" ;;
            *)                               ACTION_DESC="❓ Unknown action: $ACTION" ;;
          esac

          if [[ "$ACTION" == "enable" || "$ACTION" == "disable" ]]; then
            if [[ -n "$APP_CLIENT_ID" ]]; then
              APPLY_DESC="Handled by the **apply** job (GitHub App) — see its summary below."
            else
              APPLY_DESC="⏭️ Not applied: the GitHub App is not configured (\`AUTO_MERGE_APP_CLIENT_ID\` is unset)."
            fi
          else
            APPLY_DESC="Nothing to apply."
          fi

          {
            echo "# 🤖 Auto-merge on Approval Summary"
            echo ""
            echo "**⏰ Processed:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**📋 PR:** #${PR_NUMBER:-unknown}"
            echo ""
            echo "## 🎯 Decision"
            echo ""
            echo "$ACTION_DESC"
            echo ""
            echo "$APPLY_DESC"
            echo ""
            echo "### 🔧 Current Configuration"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Min approvals | ${MIN_APPROVALS} |"
            echo "| Require all reviews | ${REQUIRE_ALL_REVIEWS} |"
            echo "| Allowed merge types | ${MERGE_TYPES} |"
            echo "| Skip draft PRs | ${SKIP_DRAFT} |"
            echo "| Skip WIP PRs | ${SKIP_WIP} |"
            echo "| Skip bot PRs | ${SKIP_BOT_PRS} |"
            echo "| Skip fork PRs | ${SKIP_FORK_PRS} |"
            echo ""
            echo "---"
            echo "🤖 _Automated by GitHub Actions_"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------------------
  # Apply: enable or disable auto-merge with a GitHub App token
  #
  # Reconciles rather than replays: it re-reads the PR and applies the same rule as
  # `evaluate` to that fresh data, so the evaluation that queued it only decides
  # *whether* it runs. A run that waited in the queue, or was superseded, therefore
  # never acts on a stale decision (retargeted base, label removed, re-armed...).
  #
  # SECURITY: this is the only job that can read the App private key. Every step in
  # a job can read every secret the job uses (they sit in the runner's memory), so
  # this job runs nothing but GitHub's own token action (pinned by SHA) and the
  # preinstalled gh CLI: no checkout, no local actions, no third-party actions.
  #
  # The `auto-merge` environment holds the key and must only allow protected
  # long-lived branches. workflow_run always runs on the default branch.
  # `deployment: false` uses its secrets without creating a deployment record.
  # ----------------------------------------------------------------------------------
  apply:
    name: 🚀 Apply auto-merge decision
    needs: evaluate
    if: |
      vars.AUTO_MERGE_APP_CLIENT_ID != '' &&
      contains(fromJSON('["enable", "disable"]'), needs.evaluate.outputs.action)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Queue, never cancel: see "Concurrency Control" at the top
    concurrency:
      group: ${{ github.workflow }}-apply-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    environment:
      name: auto-merge
      deployment: false
    permissions: {} # Everything here uses the App token, never GITHUB_TOKEN

    steps:
      # --------------------------------------------------------------------
      # Mint a short-lived installation token (this repository only)
      # --------------------------------------------------------------------
      - name: 🔑 Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          # Least privilege: no owner/repositories inputs = this repository only, and
          # only the two permissions merging needs. Revoked at job end.
          permission-contents: write
          permission-pull-requests: write

      # --------------------------------------------------------------------
      # Re-read the PR right before acting and decide what to do now:
      # enable, disable or nothing — the same rule as the evaluate job.
      # --------------------------------------------------------------------
      - name: 🔍 Re-check the PR
        id: recheck
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr-number }}
          MIN_APPROVALS: ${{ needs.evaluate.outputs.min-approvals }}
          REQUIRE_ALL_REVIEWS: ${{ needs.evaluate.outputs.require-all-reviews }}
          SKIP_DRAFT: ${{ needs.evaluate.outputs.skip-draft }}
          SKIP_WIP: ${{ needs.evaluate.outputs.skip-wip }}
          WIP_LABELS: ${{ needs.evaluate.outputs.wip-labels }}
          REQUIRE_LABEL: ${{ needs.evaluate.outputs.require-label }}
          AUTOMERGE_LABEL: ${{ needs.evaluate.outputs.automerge-label }}
        run: |
          # pipefail: a failed review listing below must fail this step (and so
          # skip enabling/disabling), not count as zero approvals
          set -o pipefail
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          read -r STATE CURRENT_SHA ARMED ARMED_BY_APP DRAFT PENDING_REVIEWS HAS_LABEL IS_WIP < <(jq -r \
            --arg app_bot "$APP_BOT" --arg label "$AUTOMERGE_LABEL" --arg wip "$WIP_LABELS" '
            ($wip | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $wip_labels
            | [ .state, .head.sha, (.auto_merge != null), (.auto_merge.enabled_by.login == $app_bot), .draft,
                ((.requested_reviewers // [] | length) + (.requested_teams // [] | length)),
                any(.labels[]; .name == $label),
                ((.title // "" | test("\\b(wip|work.in.progress)\\b"; "i")) or any(.labels[]; .name | IN($wip_labels[]))) ]
            | @tsv' <<< "$PR_JSON")

          # Same counting rules as the evaluate job: latest verdict per reviewer,
          # approvals only from OWNER/MEMBER/COLLABORATOR
          REVIEW_COUNTS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" | jq -rs '
            add // []
            | map(select(.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED")))
            | group_by(.user.id // "deleted-user:\(.id)")
            | map(max_by(.submitted_at))
            | [ (map(select(.state == "APPROVED" and (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))) | length),
                (map(select(.state == "CHANGES_REQUESTED")) | length) ]
            | @tsv')
          read -r APPROVALS CHANGES_REQUESTED <<< "$REVIEW_COUNTS"

          # Required status checks on the CURRENT base (ruleset or classic branch
          # protection). Empty = couldn't read them, which fails closed below.
          BASE=$(jq -r '.base.ref | @uri' <<< "$PR_JSON")
          REQUIRED_CHECKS=""
          if RULES=$(gh api "repos/$REPO/rules/branches/$BASE" 2>/dev/null) &&
             BRANCH=$(gh api "repos/$REPO/branches/$BASE" 2>/dev/null); then
            REQUIRED_CHECKS=$(jq -n --argjson rules "$RULES" --argjson branch "$BRANCH" '
              ([$rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks // [] | length] | add // 0)
              + ($branch.protection.required_status_checks // null
                 | if . != null and .enforcement_level != "off" then (.contexts // [] | length) else 0 end)')
          fi

          # Same conditions, in the same order, as the evaluate job's blockers
          BLOCKERS=()
          if [[ "$SKIP_DRAFT" == "true" && "$DRAFT" == "true" ]]; then
            BLOCKERS+=("PR is a draft")
          fi
          if [[ "$SKIP_WIP" == "true" && "$IS_WIP" == "true" ]]; then
            BLOCKERS+=("PR is marked as work in progress")
          fi
          if [[ "$REQUIRE_LABEL" == "true" && "$HAS_LABEL" != "true" ]]; then
            BLOCKERS+=("missing label \"$AUTOMERGE_LABEL\"")
          fi
          if [[ "$CHANGES_REQUESTED" -gt 0 ]]; then
            BLOCKERS+=("changes requested")
          fi
          if [[ "$APPROVALS" -lt "$MIN_APPROVALS" ]]; then
            BLOCKERS+=("approvals $APPROVALS/$MIN_APPROVALS")
          fi
          if [[ "$REQUIRE_ALL_REVIEWS" == "true" && "$PENDING_REVIEWS" -gt 0 ]]; then
            BLOCKERS+=("$PENDING_REVIEWS review request(s) pending")
          fi
          if [[ -z "$REQUIRED_CHECKS" ]]; then
            BLOCKERS+=("could not read the base branch required checks")
          elif [[ "$REQUIRED_CHECKS" -eq 0 ]]; then
            BLOCKERS+=("base branch requires no status checks")
          fi
          REASONS=""
          if [[ ${#BLOCKERS[@]} -gt 0 ]]; then
            printf -v REASONS '%s, ' "${BLOCKERS[@]}"
            REASONS="${REASONS%, }"
          fi

          # Same rule as the evaluate job: "Changes Requested" revokes any arming;
          # any other unmet condition only revokes this App's own arming
          if [[ "$STATE" != "open" ]]; then
            DECISION="none"; WHY="PR is $STATE"
          elif [[ "$ARMED" == "true" ]]; then
            if [[ "$ARMED_BY_APP" == "true" && -n "$REASONS" ]]; then
              DECISION="disable"; WHY="$REASONS"
            elif [[ "$CHANGES_REQUESTED" -gt 0 ]]; then
              DECISION="disable"; WHY="changes requested"
            elif [[ -n "$REASONS" ]]; then
              DECISION="none"; WHY="armed by someone other than this App, no changes requested ($REASONS)"
            else
              DECISION="none"; WHY="auto-merge already enabled"
            fi
          elif [[ -n "$REASONS" ]]; then
            DECISION="none"; WHY="$REASONS"
          else
            DECISION="enable"; WHY="all conditions met"
          fi

          echo "📋 PR #$PR_NUMBER: state=$STATE head=$CURRENT_SHA armed=$ARMED (by this App: $ARMED_BY_APP)"
          echo "👥 Reviews: $APPROVALS approvals, $CHANGES_REQUESTED changes requested, $PENDING_REVIEWS pending"
          echo "🛡️ Required checks on base: ${REQUIRED_CHECKS:-unknown}"
          echo "🎯 Decision: $DECISION ($WHY)"
          {
            echo "decision=$DECISION"
            echo "reason=$WHY"
            echo "head-sha=$CURRENT_SHA"
            echo "approvals=$APPROVALS"
            echo "changes-requested=$CHANGES_REQUESTED"
            echo "pending-reviews=$PENDING_REVIEWS"
          } >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------
      # Enable auto-merge, pinned to the re-checked head commit
      # --------------------------------------------------------------------
      - name: 🚀 Enable auto-merge
        id: enable
        if: steps.recheck.outputs.decision == 'enable'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr-number }}
          HEAD_SHA: ${{ steps.recheck.outputs.head-sha }}
          MERGE_TYPE: ${{ needs.evaluate.outputs.merge-type }}
          DELETE_BRANCH: ${{ needs.evaluate.outputs.delete-branch }}
          COMMENT_ON_ENABLE: ${{ needs.evaluate.outputs.comment-on-enable }}
          LABELS_TO_ADD: ${{ needs.evaluate.outputs.labels-to-add }}
          MIN_APPROVALS: ${{ needs.evaluate.outputs.min-approvals }}
          APPROVALS: ${{ steps.recheck.outputs.approvals }}
          CHANGES_REQUESTED: ${{ steps.recheck.outputs.changes-requested }}
          PENDING_REVIEWS: ${{ steps.recheck.outputs.pending-reviews }}
        run: |
          outcome() { echo "outcome=$1" >> "$GITHUB_OUTPUT"; }

          # --match-head-commit: a push after the re-check makes this fail instead
          # of arming commits nobody checked
          ARGS=(pr merge "$PR_NUMBER" --repo "$REPO" --auto --match-head-commit "$HEAD_SHA")
          case "$MERGE_TYPE" in
            merge)  ARGS+=(--merge);  MERGE_TYPE_TEXT="create a merge commit" ;;
            rebase) ARGS+=(--rebase); MERGE_TYPE_TEXT="rebase and merge" ;;
            *)      ARGS+=(--squash); MERGE_TYPE_TEXT="squash and merge" ;;
          esac
          if [[ "$DELETE_BRANCH" == "true" ]]; then
            ARGS+=(--delete-branch)
          fi

          echo "🚀 Enabling auto-merge: gh ${ARGS[*]}"
          if MERGE_OUTPUT=$(gh "${ARGS[@]}" 2>&1); then
            echo "$MERGE_OUTPUT"
            echo "✅ Auto-merge enabled! PR will merge when all status checks pass."
            outcome enabled
          elif grep -qi "already enabled" <<< "$MERGE_OUTPUT"; then
            # Race: another run enabled it first
            echo "ℹ️  Auto-merge already enabled by another workflow run"
            outcome already-enabled
            exit 0
          else
            echo "❌ Failed to enable auto-merge: $MERGE_OUTPUT"
            if [[ "$COMMENT_ON_ENABLE" == "true" ]]; then
              gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --silent -f body="⚠️ **Auto-merge failed**

          Could not enable auto-merge: $MERGE_OUTPUT

          This might be due to:
          - Branch protection rules
          - Missing permissions
          - Repository settings" || echo "⚠️ Could not post the failure comment"
            fi
            outcome failed
            exit 1
          fi

          # Comment and labels are best effort: auto-merge is already enabled, so a
          # failure here must not skip the rest or fail the run
          if [[ "$COMMENT_ON_ENABLE" == "true" ]]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --silent -f body="🤖 **Auto-merge enabled**

          This PR will automatically $MERGE_TYPE_TEXT when all required status checks pass.

          ✅ Approvals: $APPROVALS/$MIN_APPROVALS
          🔍 Changes requested: $CHANGES_REQUESTED
          ⏳ Pending reviews: $PENDING_REVIEWS" || echo "⚠️ Could not post the enable comment"
          fi

          LABEL_ARGS=()
          IFS=',' read -ra LABELS <<< "$LABELS_TO_ADD"
          for label in "${LABELS[@]}"; do
            # Trim surrounding whitespace
            label="${label#"${label%%[![:space:]]*}"}"
            label="${label%"${label##*[![:space:]]}"}"
            if [[ -n "$label" ]]; then
              LABEL_ARGS+=(-f "labels[]=$label")
            fi
          done
          if [[ ${#LABEL_ARGS[@]} -gt 0 ]]; then
            if gh api -X POST "repos/$REPO/issues/$PR_NUMBER/labels" --silent "${LABEL_ARGS[@]}"; then
              echo "🏷️ Added labels: $LABELS_TO_ADD"
            else
              echo "⚠️ Could not add labels: $LABELS_TO_ADD"
            fi
          fi

      # --------------------------------------------------------------------
      # Disable auto-merge
      # --------------------------------------------------------------------
      - name: 🛑 Disable auto-merge
        id: disable
        if: steps.recheck.outputs.decision == 'disable'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr-number }}
          REASON: ${{ steps.recheck.outputs.reason }}
          COMMENT_ON_DISABLE: ${{ needs.evaluate.outputs.comment-on-disable }}
          LABELS_TO_ADD: ${{ needs.evaluate.outputs.labels-to-add }}
          AUTOMERGE_LABEL: ${{ needs.evaluate.outputs.automerge-label }}
        run: |
          outcome() { echo "outcome=$1" >> "$GITHUB_OUTPUT"; }

          if DISABLE_OUTPUT=$(gh pr merge "$PR_NUMBER" --repo "$REPO" --disable-auto 2>&1); then
            echo "🛑 Auto-merge disabled: $REASON"
            outcome disabled
          elif grep -qi "not enabled" <<< "$DISABLE_OUTPUT"; then
            echo "ℹ️  Auto-merge was not enabled, no action needed"
            outcome not-enabled
            exit 0
          else
            # Don't fail the workflow, but log the error properly
            echo "❌ Failed to disable auto-merge: $DISABLE_OUTPUT"
            outcome failed-disable
            exit 0
          fi

          # Remove the labels added on enable (never the opt-in label itself).
          # Best effort: a label that isn't on the PR returns 404.
          IFS=',' read -ra LABELS <<< "$LABELS_TO_ADD"
          for label in "${LABELS[@]}"; do
            # Trim surrounding whitespace
            label="${label#"${label%%[![:space:]]*}"}"
            label="${label%"${label##*[![:space:]]}"}"
            if [[ -n "$label" && "$label" != "$AUTOMERGE_LABEL" ]]; then
              ENCODED=$(jq -rn --arg l "$label" '$l | @uri')
              if gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$ENCODED" --silent 2>/dev/null; then
                echo "🏷️ Removed label: $label"
              fi
            fi
          done

          if [[ "$COMMENT_ON_DISABLE" == "true" ]]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --silent -f body="🛑 **Auto-merge disabled**

          Reason: $REASON. Auto-merge will be re-enabled when conditions are met again." || echo "⚠️ Could not post the disable comment"
          fi

      # --------------------------------------------------------------------
      # Outcome summary
      # --------------------------------------------------------------------
      - name: 📊 Generate apply summary
        if: always()
        env:
          ENABLE_OUTCOME: ${{ steps.enable.outputs.outcome }}
          DISABLE_OUTCOME: ${{ steps.disable.outputs.outcome }}
          DECISION: ${{ steps.recheck.outputs.decision }}
          REASON: ${{ steps.recheck.outputs.reason }}
          TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr-number }}
        run: |
          OUTCOME="${ENABLE_OUTCOME:-${DISABLE_OUTCOME:-}}"
          if [[ "$TOKEN_OUTCOME" != "success" ]]; then
            OUTCOME="token-failed"
          elif [[ "$RECHECK_OUTCOME" != "success" ]]; then
            OUTCOME="recheck-failed"
          elif [[ "$DECISION" == "none" ]]; then
            OUTCOME="no-change"
          fi
          case "$OUTCOME" in
            enabled)         DESC="✅ Auto-merge enabled" ;;
            already-enabled) DESC="✅ Auto-merge was already enabled" ;;
            disabled)        DESC="🛑 Auto-merge disabled ($REASON)" ;;
            not-enabled)     DESC="ℹ️ Auto-merge was not enabled" ;;
            no-change)       DESC="⏭️ Nothing to do on fresh data ($REASON)" ;;
            failed)          DESC="❌ Failed to enable auto-merge" ;;
            failed-disable)  DESC="❌ Failed to disable auto-merge" ;;
            token-failed)    DESC="❌ Could not create the GitHub App token (App installed? key set in the 'auto-merge' environment?)" ;;
            recheck-failed)  DESC="❌ Could not re-read the PR before acting — nothing was changed" ;;
            *)               DESC="❓ Unknown outcome: ${OUTCOME:-none}" ;;
          esac
          {
            echo "## 🚀 Apply Outcome — PR #$PR_NUMBER"
            echo ""
            echo "$DESC"
            echo ""
            echo "**Acting as:** \`${APP_SLUG:-unknown}[bot]\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Apply outcome: $DESC"
